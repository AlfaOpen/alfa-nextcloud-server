stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1
  KUBERNETES_PRIVILEGED: "true"
  APP_NAME: alfa-nextcloud-server
  IMAGE_NAME: alfa-nextcloud-server
  GIT_DEPTH: "0"
  DEVELOP_BRANCH: "develop"
  STAGE_BRANCH: "stage"
  MAIN_BRANCH: "main-alfameg"
  RELEASE_END: "-RELEASE"
  DEMO_END: "-DEMO"
  NEXTCLOUD_COMMIT_SHA:
    value: ""
    description: "SHA (anche breve) del commit da buildare, usato anche come versione del pacchetto. Vuoto = ultimo commit del branch."

.nextcloud-version: &nextcloud-version
  - VERSION_STRING=$(grep -oE "OC_VersionString = '[^']+'" ./version.php | cut -d "'" -f2)
  - VERSION_NUMBER=$(echo "$VERSION_STRING" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
  - echo "Nextcloud $VERSION_STRING -> $VERSION_NUMBER"
  - IMAGE_TAG=v"$VERSION_NUMBER"
  - export VERSION_NUMBER="$VERSION_NUMBER"
  - export IMAGE_TAG="$IMAGE_TAG"
  - export RELEASE_TAG="$IMAGE_TAG""$RELEASE"

build-nextcloud:
  stage: build
  tags:
    - stage
  image: node:24
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"'
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
    CYPRESS_INSTALL_BINARY: "0"
    PUPPETEER_SKIP_DOWNLOAD: "true"
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    NODE_OPTIONS: "--max-old-space-size=4096"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    PACKAGE_NAME: nextcloud-html
    PACKAGE_FILE: nextcloud-html.tar.gz
  cache:
    key:
      files:
        - build/frontend/package-lock.json
        - build/frontend-legacy/package-lock.json
    paths:
      - .npm/
  before_script:
    - |
      if [ -n "$NEXTCLOUD_COMMIT_SHA" ]; then
        NEXTCLOUD_COMMIT_SHA=$(echo "$NEXTCLOUD_COMMIT_SHA" | tr 'A-F' 'a-f')
        echo "$NEXTCLOUD_COMMIT_SHA" | grep -qE '^[0-9a-f]{7,40}$' \
          || { echo "NEXTCLOUD_COMMIT_SHA non valido: '$NEXTCLOUD_COMMIT_SHA'"; exit 1; }
        git cat-file -e "${NEXTCLOUD_COMMIT_SHA}^{commit}" 2>/dev/null \
          || git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
        BUILD_SHA=$(git rev-parse --verify --quiet "${NEXTCLOUD_COMMIT_SHA}^{commit}") \
          || { echo "Commit '$NEXTCLOUD_COMMIT_SHA' non trovato o ambiguo"; exit 1; }
        git checkout --force --quiet "$BUILD_SHA"
        PACKAGE_VERSION="$NEXTCLOUD_COMMIT_SHA"
      else
        BUILD_SHA="$CI_COMMIT_SHA"
        PACKAGE_VERSION="$CI_COMMIT_SHORT_SHA"
      fi
      echo "Build di Nextcloud al commit $BUILD_SHA (versione pacchetto: $PACKAGE_VERSION)"
    - *nextcloud-version
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends rsync
    - git submodule sync --recursive
    - git submodule update --init --recursive --force
    - npm ci
    - npm run build
    - rsync -a --exclude-from=.nextcloudignore --exclude=/html --exclude=/.npm --exclude=node_modules --exclude=/.gitlab-ci.yml ./ html/
    - tar -czf "$PACKAGE_FILE" html
    - |
      curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$PACKAGE_FILE" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$PACKAGE_VERSION/$PACKAGE_FILE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$MAIN_BRANCH" ] && [ "$BUILD_SHA" = "$CI_COMMIT_SHA" ]; then
        echo "$PACKAGE_VERSION" > latest.txt
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file latest.txt \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/latest/latest.txt"
      fi

deploy-registry:
  stage: deploy
  tags:
    - stage
  image: docker:29.9.2-cli
  before_script: *nextcloud-version
  services:
    - name: docker:29.9.2-dind
      command: ["--dns", "8.8.8.8", "--dns", "1.1.1.1", "--mtu=1400"]
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"'
      when: never
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
      variables:
        RELEASE: $RELEASE_END
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-stage$/'
      variables:
        RELEASE: $DEMO_END
  script:
    - echo $HARBOR_PASSWORD | docker login $HARBOR_URL -u $HARBOR_USERNAME --password-stdin
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:$IMAGE_TAG
