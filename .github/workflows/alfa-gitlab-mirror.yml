name: Mirror for Alfameg GitLab

on:
  push:
    branches:
      - 'main-alfameg'

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main-alfameg
          fetch-depth: 0
      - name: Mirror branch to GitLab
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow origin "$GITHUB_REF_NAME"
          else
            git fetch origin "$GITHUB_REF_NAME"
          fi

          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            echo "::error::The checkout is still shallow; refusing to push an incomplete history."
            exit 1
          fi

          auth_header="Authorization: Basic $(printf '%s:%s' "$GITLAB_USERNAME" "$GITLAB_PASSWORD" | base64 -w 0)"
          git -c http.extraheader="$auth_header" push --force \
            "https://${GITLAB_HOSTNAME}/developteam/inest-team/nextcloud-apps/alfa-nextcloud-server.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"

          if [[ "$FOLLOW_TAGS" == "true" ]]; then
            git -c http.extraheader="$auth_header" push --force \
              "https://${GITLAB_HOSTNAME}/developteam/inest-team/nextcloud-apps/alfa-nextcloud-server.git" \
              --tags
          fi
        env:
          FOLLOW_TAGS: "false"
          FORCE_PUSH: "true"
          GITLAB_HOSTNAME: "gitlab.alfameg.it"
          GITLAB_USERNAME: "g.mangelli"
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
          GITLAB_PROJECT_ID: "386"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
