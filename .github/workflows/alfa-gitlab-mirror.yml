name: Mirror for Alfameg GitLab

on:
  push:
    branches:
      - 'main-alfameg'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Compute cache week
        id: cache-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache bare repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mirror.git
          key: gitlab-mirror-${{ github.ref_name }}-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            gitlab-mirror-${{ github.ref_name }}-

      - name: Mirror branch to GitLab
        run: |
          set -euo pipefail

          git init --bare --quiet mirror.git
          cd mirror.git
          git config gc.auto 0
          git config maintenance.auto false

          refspecs=("+refs/heads/${GITHUB_REF_NAME}:refs/heads/${GITHUB_REF_NAME}")
          if [[ "$FOLLOW_TAGS" == "true" ]]; then
            refspecs+=("+refs/tags/*:refs/tags/*")
          fi

          github_auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          echo "Fetch di ${GITHUB_REF_NAME} da GitHub (storia completa)"
          git -c http.extraheader="$github_auth" fetch --progress --no-tags \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${refspecs[@]}"

          gitlab_url="https://${GITLAB_HOSTNAME}/developteam/inest-team/nextcloud-apps/alfa-nextcloud-server.git"
          gitlab_auth="Authorization: Basic $(printf '%s:%s' "$GITLAB_USERNAME" "$GITLAB_PASSWORD" | base64 -w 0)"
          echo "Push di ${GITHUB_REF_NAME} su GitLab"
          git -c http.extraheader="$gitlab_auth" push --progress --force "$gitlab_url" \
            "refs/heads/${GITHUB_REF_NAME}:refs/heads/${GITHUB_REF_NAME}"

          if [[ "$FOLLOW_TAGS" == "true" ]]; then
            git -c http.extraheader="$gitlab_auth" push --progress --force "$gitlab_url" --tags
          fi
        env:
          FOLLOW_TAGS: "false"
          FORCE_PUSH: "true"
          GITLAB_HOSTNAME: "gitlab.alfameg.it"
          GITLAB_USERNAME: "g.mangelli"
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
          GITLAB_PROJECT_ID: "386"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
