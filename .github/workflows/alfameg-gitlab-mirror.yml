name: alfameg-gitlab-mirror

on:
  push:
    branches:
      - 'main-alfameg'

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main-alfameg
      - name: Mirror + trigger CI
        uses: SvanBoxel/gitlab-mirror-and-ci-action@0.6
        with:
          args: "https://gitlab.alfameg.it/developteam/inest-team/nextcloud-apps/alfa-nextcloud-server"
        env:
          FOLLOW_TAGS: "false"
          FORCE_PUSH: "true"
          GITLAB_HOSTNAME: "gitlab.alfameg.it"
          GITLAB_USERNAME: "g.mangelli"
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
          GITLAB_PROJECT_ID: "386"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
